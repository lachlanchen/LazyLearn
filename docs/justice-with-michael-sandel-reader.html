<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Justice with Michael Sandel Reader</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="background-glow" aria-hidden="true"></div>
    <main class="pdf-reader-page">
      <section class="pdf-reader-shell">
        <div class="pdf-reader-intro">
          <p class="eyebrow">Embedded Reader</p>
          <h1>Justice with Michael Sandel</h1>
          <p class="tagline">
            Read the publication inline instead of opening a bare PDF file. This edition keeps the
            full course book inside the website.
          </p>
        </div>

        <div class="pdf-reader-toolbar">
          <div class="pdf-reader-language-group">
            <span class="pdf-reader-chip is-active" aria-current="page">English</span>
          </div>
          <div class="pdf-reader-actions">
            <a
              class="pdf-reader-link"
              href="justice-with-michael-sandel.pdf"
              target="_blank"
              rel="noopener"
              >Open raw PDF</a
            >
            <a
              class="pdf-reader-link"
              href="https://github.com/lachlanchen/LazyLearn/tree/main/justice-with-michael-sandel"
              target="_blank"
              rel="noopener"
              >Open source folder</a
            >
            <a class="pdf-reader-link" href="index.html">Back to site</a>
          </div>
        </div>

        <div class="pdf-reader-stage">
          <iframe
            title="Justice with Michael Sandel PDF reader"
            src="justice-with-michael-sandel.pdf"
          ></iframe>
          <p class="pdf-reader-fallback">
            If the inline reader does not load, use
            <a href="justice-with-michael-sandel.pdf" target="_blank" rel="noopener"
              >the direct PDF link</a
            >.
          </p>
        </div>
      </section>
    </main>
  </body>
</html>
